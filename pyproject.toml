[project]
name = "local-meeting-minutes"
version = "0.1.0"
description = "Local-first meeting minutes scaffold for team Юфсшники"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
